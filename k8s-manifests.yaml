# Kubernetes manifests for deploying the Spotify web clone to AKS.
# Apply everything with:
#   kubectl apply -f k8s-manifests.yaml
#
# Before applying:
#   1. Replace <acrName> below with your Azure Container Registry name.
#   2. Build & push the image (see Dockerfile at repo root):
#        az acr build --registry <acrName> --image spotify-web:latest .
#   3. Make sure AKS can pull from ACR:
#        az aks update -g <rg> -n <aksName> --attach-acr <acrName>
#   4. (Ingress) Install an ingress controller first, e.g.:
#        helm install ingress-nginx ingress-nginx/ingress-nginx \
#          --namespace ingress-nginx --create-namespace
#   5. Update the `host` field in the Ingress section to your own domain,
#      or remove it to match any host.

apiVersion: v1
kind: Namespace
metadata:
  name: spotify-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-web
  namespace: spotify-web
  labels:
    app: spotify-web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: spotify-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: spotify-web
    spec:
      containers:
        - name: spotify-web
          # Replace <acrName> with your Azure Container Registry name and
          # bump the tag every time you push a new image.
          image: <acrName>.azurecr.io/spotify-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-web
  namespace: spotify-web
  labels:
    app: spotify-web
spec:
  type: ClusterIP
  selector:
    app: spotify-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Requires an ingress controller installed in the cluster (see notes above).
# For TLS, install cert-manager, add a ClusterIssuer, and uncomment the
# annotation + tls block below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-web
  namespace: spotify-web
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: spotify-web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-web
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - spotify-web.example.com
  #     secretName: spotify-web-tls
